# ~/.config/hypr/conf/windowrules.conf
# New-style window rules (Hyprland 0.53+): match:<field> criteria, effect keywords.
# Note: blur is global (theme.conf decoration.blur); per-window opt-out is `no_blur`.

# --- Kitty Terminal Transparency ---
windowrule = match:class ^(kitty)$, opacity 0.94 0.90

# --- Wofi Transparency ---
windowrule = match:class ^(wofi)$, opacity 0.90

# --- Motrix Launch in Workspace 5 ---
windowrule = match:class ^(motrix)$, workspace 5

