# ~/.config/hypr/conf/windowrules.conf
# New-style window rules (Hyprland 0.53+): match:<field> criteria, effect keywords.
# Note: blur is global (theme.conf decoration.blur); per-window opt-out is `no_blur`.

# --- Kitty Terminal Transparency ---
windowrule = match:class ^(kitty)$, opacity 0.94 0.90

# --- Wofi Transparency ---
windowrule = match:class ^(wofi)$, opacity 0.90

# --- Task Manager (Super+Delete) — frosted terminal-style floating dialog ---
windowrule = match:class ^(potato-taskmgr)$, float on
windowrule = match:class ^(potato-taskmgr)$, size 900 640
windowrule = match:class ^(potato-taskmgr)$, center on
windowrule = match:class ^(potato-taskmgr)$, pin on
windowrule = match:class ^(potato-taskmgr)$, opacity 0.92 0.88
