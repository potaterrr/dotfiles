# ~/.config/hypr/conf/windowrules.conf

# --- Kitty Terminal Blur and Transparency ---
# Target the "kitty" window class specifically
# Syntax: opacity [focused] [unfocused]
windowrulev2 = opacity 0.94 0.90, class:^(kitty)$   # 94% solid when active, 90% when backgrounded
windowrulev2 = blur, class:^(kitty)$

# --- Wofi Blur and Transparency ---
windowrulev2 = opacity 0.90, class:^(wofi)$         # 90% opacity for Wofi window
windowrulev2 = blur, class:^(wofi)$                # Directs Hyprland to apply the frosted glass filter

