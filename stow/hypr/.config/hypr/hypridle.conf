# ~/.config/hypr/hypridle.conf
# Idle daemon: dim -> lock -> display off -> suspend.
# Laptop-aware: on battery we suspend early; on AC we only suspend after 1h.

general {
    ignore_dbus_inhibit = false       # respect inhibitors (videos keep the screen awake)
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = hyprlock       # lock is guaranteed up before any suspend
    after_sleep_cmd = hyprctl dispatch dpms on
}

# --- 2 min: dim to 0% (screen appears off) ---
# Any key/mouse movement restores brightness AND drops you on the hyprlock login.
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 0
    on-resume = sh -c 'brightnessctl -r; pidof hyprlock || hyprlock'
}

# --- 10 min: lock the session (same as Super+L) ---
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
}

# --- 15 min: display off ---
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = sh -c 'hyprctl dispatch dpms on; brightnessctl -r; pidof hyprlock || hyprlock'
}

# --- 25 min: suspend, but only on battery ---
listener {
    timeout = 1500
    on-timeout = sh -c 'grep -q 1 /sys/class/power_supply/A*/online || systemctl suspend'
}

# --- 60 min: suspend regardless of power source ---
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
