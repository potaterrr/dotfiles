# ~/.config/hypr/conf/keybinds.conf

$mainMod = SUPER

# --- Core App Triggers ---
bind = $mainMod, T, exec, kitty                     # Super + T opens Kitty Terminal
bind = $mainMod, R, exec, wofi --show drun          # Super + R opens Wofi App Launcher
bind = $mainMod, B, exec, brave-browser             # Super + B opens Brave Browser
bind = $mainMod, Q, killactive,                     # Super + Q closes the active window
bind = $mainMod, M, exit,                           # Super + M quits Hyprland
bind = $mainMod, E, exec, dolphin                   # Super + E opens dolphin
bind = $mainMod, L, exec, hyprlock                  # Lock screen with SUPER + L

# --- Core App Triggers ---
bind = $mainMod SHIFT, L, exec, wlogout              # Super + Shift + L opens the Power Menu

# --- Fast System Refresh Shortcut ---
bind = $mainMod SHIFT, R, exec, hyprctl reload      # Super + Shift + R refreshes all configs instantly

# --- Hardware System Controls (ThinkPad E14) ---

# Volume Controller Buttons (WirePlumber)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Screen Brightness Buttons (brightnessctl)
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ==========================================
# WORKSPACE KEYBINDS & ANIMATIONS
# ==========================================

# 1. Switch workspaces with SUPER + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# 2. Move active window to a workspace with SUPER + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# 3. Smooth Workspace Swipe Animations
# (Make sure these are placed inside or alongside your animations {} block)
animations {
    enabled = true
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    animation = workspaces, 1, 4, easeOutQuint, slide
}
# Toggle clean Monocle Mode / Fullscreen layout (SUPER + F)
bind = SUPER, F, fullscreen, 0



