

# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

#autogenerated = 1

#exec
exec-once = sleep 1 && waybar

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu

#monitor
monitor=eDP-1, 1920x1080@60, 0x0, 1

#inputs

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0.0          # Flat mouse profile speed for the TrackPoint/external mouse
    accel_profile = flat

    touchpad {
        natural_scroll = true        # Inverts scroll direction (fixes your trackpad issue)
        tap-to-click = true          # Tap gently to click
        disable_while_typing = true  # Prevents accidental palm jumps while typing
        scroll_factor = 1.0          # Adjust if scrolling feels too fast or slow
        middle_button_emulation = true # Tap with 3 fingers for middle-click
    }
}

input {
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gestures {
    # 3-finger horizontal swipe to switch workspaces
    gesture = 3, horizontal, workspace
}
